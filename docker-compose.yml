services:
  photo-prestige:
    build:
      context: ./photo-prestige
    container_name: photo-prestige-api-gateway
    depends_on:
      - auth-service
      - target-service
      - register-service
      - score-service
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:3001}
      - TARGET_SERVICE_URL=${TARGET_SERVICE_URL:-http://target-service:3002}
      - REGISTER_SERVICE_URL=${REGISTER_SERVICE_URL:-http://register-service:3003}
      - SCORE_SERVICE_URL=${SCORE_SERVICE_URL:-http://score-service:3005}

  auth-service:
    build:
      context: ./auth-service
    container_name: photo-prestige-auth-service
    depends_on:
      - mongodb
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - MONGODB_URI=${AUTH_MONGODB_URI:-mongodb://mongodb:27017/photo-prestige}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-real-deployments}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}

  target-service:
    build:
      context: ./target-service
    container_name: photo-prestige-target-service
    depends_on:
      - mongodb
    ports:
      - "${TARGET_SERVICE_PORT:-3002}:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3002
      - MONGODB_URI=${TARGET_MONGODB_URI:-mongodb://mongodb:27017/photo-prestige}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-real-deployments}

  register-service:
    build:
      context: ./register-service
    container_name: photo-prestige-register-service
    depends_on:
      - register-mongodb
      - rabbitmq
    ports:
      - "${REGISTER_SERVICE_PORT:-3003}:3003"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3003
      - MONGODB_URI=${REGISTER_MONGODB_URI:-mongodb://register-mongodb:27017/register-service}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-real-deployments}
      
      - TARGET_SERVICE_URL=${TARGET_SERVICE_URL:-http://target-service:3002}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

  score-service:
    build:
      context: ./score-service
    container_name: photo-prestige-score-service
    depends_on:
      - score-mongodb
      - target-service
    ports:
      - "${SCORE_SERVICE_PORT:-3005}:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3005
      - MONGODB_URI=${SCORE_MONGODB_URI:-mongodb://score-mongodb:27017/score-service}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-real-deployments}
      - TARGET_SERVICE_URL=${TARGET_SERVICE_URL:-http://target-service:3002}
      - IMAGGA_API_KEY=${IMAGGA_API_KEY:-}
      - IMAGGA_API_SECRET=${IMAGGA_API_SECRET:-}
      - IMAGGA_API_BASE_URL=${IMAGGA_API_BASE_URL:-https://api.imagga.com/v2}

  mongodb:
    image: mongo:7
    container_name: photo-prestige-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=photo-prestige
    volumes:
      - mongodb_data:/data/db

  register-mongodb:
    image: mongo:7
    container_name: photo-prestige-register-mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=register-service
    volumes:
      - register_mongodb_data:/data/db

  score-mongodb:
    image: mongo:7
    container_name: photo-prestige-score-mongodb
    ports:
      - "27019:27017"
    environment:
      - MONGO_INITDB_DATABASE=score-service
    volumes:
      - score_mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: photo-prestige-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  register_mongodb_data:
  score_mongodb_data:
  rabbitmq_data:
