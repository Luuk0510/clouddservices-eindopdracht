services:
  photo-prestige:
    build:
      context: ./photo-prestige
    depends_on:
      - auth-service
      - target-service
      - register-service
      - score-service
      - read-service
      - rabbitmq
      - mail-service
    expose:
      - "${GATEWAY_PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${GATEWAY_PORT:-3000}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT:-3001}
      - TARGET_SERVICE_URL=http://target-service:${TARGET_SERVICE_PORT:-3002}
      - REGISTER_SERVICE_URL=http://register-service:${REGISTER_SERVICE_PORT:-3003}
      - SCORE_SERVICE_URL=http://score-service:${SCORE_SERVICE_PORT:-3005}
      - CLOCK_SERVICE_URL=http://clock-service:${CLOCK_SERVICE_PORT:-3004}
      - READ_SERVICE_URL=http://read-service:${READ_SERVICE_PORT:-3007}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}
      - GATEWAY_PROXY_TIMEOUT_MS=${GATEWAY_PROXY_TIMEOUT_MS:-5000}
      - GATEWAY_RETRY_ATTEMPTS=${GATEWAY_RETRY_ATTEMPTS:-3}
      - GATEWAY_RETRY_DELAY_MS=${GATEWAY_RETRY_DELAY_MS:-250}
      - GATEWAY_CIRCUIT_BREAKER_THRESHOLD=${GATEWAY_CIRCUIT_BREAKER_THRESHOLD:-3}
      - GATEWAY_CIRCUIT_BREAKER_RESET_TIMEOUT_MS=${GATEWAY_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-10000}
      - MAIL_SERVICE_URL=http://mail-service:${MAIL_SERVICE_PORT:-3006}

  gateway-lb:
    image: nginx:1.27-alpine
    depends_on:
      - photo-prestige
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./nginx/gateway-lb.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      - blackbox-exporter
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "9115:9115"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

  read-service:
    build:
      context: ./read-service
    depends_on:
      - target-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${READ_SERVICE_PORT:-3007}
      - TARGET_SERVICE_URL=http://target-service:${TARGET_SERVICE_PORT:-3002}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-5000}
      - READ_SERVICE_RETRY_ATTEMPTS=${READ_SERVICE_RETRY_ATTEMPTS:-3}
      - READ_SERVICE_RETRY_DELAY_MS=${READ_SERVICE_RETRY_DELAY_MS:-250}
      - READ_SERVICE_CIRCUIT_BREAKER_THRESHOLD=${READ_SERVICE_CIRCUIT_BREAKER_THRESHOLD:-3}
      - READ_SERVICE_CIRCUIT_BREAKER_RESET_TIMEOUT_MS=${READ_SERVICE_CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-10000}

  auth-service:
    build:
      context: ./auth-service
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${AUTH_SERVICE_PORT:-3001}
      - MONGODB_URI=${AUTH_MONGODB_URI:-mongodb://mongodb:27017/photo-prestige}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - SEED_OWNER_EMAIL=${SEED_OWNER_EMAIL:-}
      - SEED_OWNER_PASSWORD=${SEED_OWNER_PASSWORD:-}

  target-service:
    build:
      context: ./target-service
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${TARGET_SERVICE_PORT:-3002}
      - MONGODB_URI=${TARGET_MONGODB_URI:-mongodb://mongodb:27017/photo-prestige}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}

  register-service:
    build:
      context: ./register-service
    depends_on:
      - register-mongodb
      - rabbitmq
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${REGISTER_SERVICE_PORT:-3003}
      - MONGODB_URI=${REGISTER_MONGODB_URI:-mongodb://register-mongodb:27017/register-service}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TARGET_SERVICE_URL=http://target-service:${TARGET_SERVICE_PORT:-3002}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}

  score-service:
    build:
      context: ./score-service
    depends_on:
      - score-mongodb
      - target-service
      - rabbitmq
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${SCORE_SERVICE_PORT:-3005}
      - MONGODB_URI=${SCORE_MONGODB_URI:-mongodb://score-mongodb:27017/score-service}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT:-3001}
      - REGISTER_SERVICE_URL=http://register-service:${REGISTER_SERVICE_PORT:-3003}
      - TARGET_SERVICE_URL=http://target-service:${TARGET_SERVICE_PORT:-3002}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}
      - IMAGGA_API_KEY=${IMAGGA_API_KEY:-}
      - IMAGGA_API_SECRET=${IMAGGA_API_SECRET:-}
      - IMAGGA_API_BASE_URL=${IMAGGA_API_BASE_URL:-https://api.imagga.com/v2}

  clock-service:
    build:
      context: ./clock-service
    depends_on:
      - clock-mongodb
      - rabbitmq
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${CLOCK_SERVICE_PORT:-3004}
      - MONGODB_URI=${CLOCK_MONGODB_URI:-mongodb://clock-mongodb:27017/clock-service}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}
      - DEADLINE_REMINDER_MINUTES=${DEADLINE_REMINDER_MINUTES:-60}
      - DEADLINE_REMINDER_INTERVAL_MINUTES=${DEADLINE_REMINDER_INTERVAL_MINUTES:-60}
      - CLOCK_POLL_INTERVAL_MS=${CLOCK_POLL_INTERVAL_MS:-5000}

  mail-service:
    build:
      context: ./mail-service
    depends_on:
      - mail-mongodb
      - rabbitmq
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${MAIL_SERVICE_PORT:-3006}
      - MAIL_MONGODB_URI=${MAIL_MONGODB_URI:-mongodb://mail-mongodb:27017/mail-service}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL is required}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-photo-prestige}
      - RABBITMQ_RECONNECT_DELAY_MS=${RABBITMQ_RECONNECT_DELAY_MS:-5000}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Photo Prestige <noreply@example.com>}

  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=photo-prestige
    volumes:
      - mongodb_data:/data/db

  register-mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=register-service
    volumes:
      - register_mongodb_data:/data/db

  score-mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=score-service
    volumes:
      - score_mongodb_data:/data/db

  clock-mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=clock-service
    volumes:
      - clock_mongodb_data:/data/db

  mail-mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=mail-service
    volumes:
      - mail_mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  register_mongodb_data:
  score_mongodb_data:
  clock_mongodb_data:
  mail_mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
