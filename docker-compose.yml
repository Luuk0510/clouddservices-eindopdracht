services:
  photo-prestige:
    build:
      context: ./photo-prestige
    container_name: photo-prestige-api-gateway
    depends_on:
      - auth-service
      - target-service
      - register-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - TARGET_SERVICE_URL=http://target-service:3002
      - REGISTER_SERVICE_URL=http://register-service:3003
      - SUBMISSION_SERVICE_URL=http://submission-service:3004
      - SCORE_SERVICE_URL=http://score-service:3005
      - READ_SERVICE_URL=http://read-service:3006

  auth-service:
    build:
      context: ./auth-service
    container_name: photo-prestige-auth-service
    depends_on:
      - mongodb
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/photo-prestige
      - JWT_SECRET=change-this-in-real-deployments
      - JWT_EXPIRES_IN=1d

  target-service:
    build:
      context: ./target-service
    container_name: photo-prestige-target-service
    depends_on:
      - mongodb
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/photo-prestige
      - JWT_SECRET=change-this-in-real-deployments

  register-service:
    build:
      context: ./register-service
    container_name: photo-prestige-register-service
    depends_on:
      - register-mongodb
      - rabbitmq
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://register-mongodb:27017/register-service
      - JWT_SECRET=change-this-in-real-deployments
      - TARGET_SERVICE_URL=http://target-service:3002
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672

  mongodb:
    image: mongo:7
    container_name: photo-prestige-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=photo-prestige
    volumes:
      - mongodb_data:/data/db

  register-mongodb:
    image: mongo:7
    container_name: photo-prestige-register-mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=register-service
    volumes:
      - register_mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: photo-prestige-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  register_mongodb_data:
  rabbitmq_data:
