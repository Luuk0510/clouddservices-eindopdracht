name: Node CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-photo-prestige:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: photo-prestige

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-prestige/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
